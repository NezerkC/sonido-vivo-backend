spring:
  application:
    name: sonidovivo
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/sonido_vivo_nosql}
  data:
    mongodb:
      auto-index-creation: true
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USER:sonido_vivo}
    password: ${ORACLE_PASS:secret}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
